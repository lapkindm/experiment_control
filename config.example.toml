# Experiment control configuration.
# Copy to config.toml and adapt ports / limits to your chamber.

[acquisition]
interval = 1.0            # s between readings of all devices
retries = 2               # extra attempts when a device does not answer
max_missed = 5            # consecutive unanswered requests before the
                          # device is closed and reopened
reconnect_delay = 5.0     # s between reconnection attempts

[logging]
directory = "logs"        # relative to this file
autostart = true          # start a CSV file on program start

[qcm]
transport = "usb"         # "usb" or "serial"
# port = "/dev/ttyUSB2"   # required for transport = "serial"
# baudrate = 19200
# timeout = 1.0           # s per request
# vid = 0x10C4            # optional explicit USB IDs
# pid = 0x83F5

[rate]
# The rate is the slope of a linear fit to the QCM thickness over the
# last `window` seconds (the rate reported by the QCM is only logged).
window = 30.0             # s; longer = less noise, more lag (~window/2)
min_fraction = 0.5        # report a rate once data span this part of the window
reset_threshold = 0.005   # kÅ; a larger thickness drop restarts the fit

[simulation]
enabled = false           # or start with --simulate
speed = 1.0               # simulated seconds per real second
failure_rate = 0.0        # probability that a simulated request is not answered

# ---------------------------------------------------------------------
# One [[cells]] block per effusion cell.

[[cells]]
name = "Cell A"
key = "A"                 # prefix of the CSV columns
sensor = 1                # SQM-160 sensor channel
model = "2408"            # Eurotherm model: "2408" or "3508"
port = "/dev/ttyUSB0"
address = 1               # Modbus address
# baudrate = 9600         # default: 9600 (2408), 19200 (3508)
# timeout = 1.0           # s per Modbus request
min_setpoint = 20.0       # °C, every setpoint write is clamped to this range,
max_setpoint = 1000.0     # °C  including writes by the rate feedback

[cells.feedback]
kp = 2.0                  # °C per unit ln(target/rate)
ki = 0.3                  # °C/s per unit ln(target/rate): 10 % low -> +1.8 °C/min
filter_tau = 0.0          # s, extra low-pass on the rate (the fit already averages)
max_slew = 10.0           # °C/min, maximum setpoint change by the feedback
rate_floor = 0.02         # rates below this fraction of the target are clipped

[[cells]]
name = "Cell B"
key = "B"
sensor = 2
model = "3508"
port = "/dev/ttyUSB1"
address = 1
min_setpoint = 20.0
max_setpoint = 800.0

[cells.feedback]
kp = 2.0
ki = 0.3
filter_tau = 0.0
max_slew = 10.0
rate_floor = 0.02
